<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .story-by { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-size: 42px; font-weight: 500; letter-spacing: 12px; text-anchor: middle; fill: url(#goldGrad); }
      .clicker-babu { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-size: 68px; font-weight: 600; letter-spacing: 16px; text-anchor: middle; fill: url(#goldGrad); }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 11px; text-anchor: middle; fill: #B89758; }
      .divider-line { stroke: #B89758; stroke-width: 1.5; stroke-opacity: 0.6; }
      .divider-diamond { fill: #ECC880; }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E2B8"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B89758"/>
      <stop offset="100%" stop-color="#8F7238"/>
    </linearGradient>
  </defs>
  
  <!-- STORY BY -->
  <text x="400" y="90" class="story-by">STORY BY</text>
  
  <!-- CLICKER BABU -->
  <text x="400" y="175" class="clicker-babu">CLICKER BABU</text>
  
  <!-- Centered Diamond Hairline Divider -->
  <line x1="200" y1="225" x2="375" y2="225" class="divider-line"/>
  <polygon points="400,217 408,225 400,233 392,225" class="divider-diamond"/>
  <line x1="425" y1="225" x2="600" y2="225" class="divider-line"/>
  
  <!-- WEDDINGS & FILMS -->
  <text x="400" y="278" class="tagline">WEDDINGS &amp; FILMS</text>
</svg>